name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: "vanirakshak-backend:."
      VR_CM_BACKEND: "stub"
      VR_ASV_BACKEND: "stub"
      VR_AUDIT_PATH: "/tmp/ci_audit_log.jsonl"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "vanirakshak-backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vanirakshak-backend/requirements.txt pytest

      - name: Run backend tests
        run: pytest vanirakshak-backend/tests/ -v

  contract-integration:
    name: Contract & Integration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONPATH: "vanirakshak-backend:."
      VR_CM_BACKEND: "stub"
      VR_ASV_BACKEND: "stub"
      VR_AUDIT_PATH: "/tmp/ci_audit_log.jsonl"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "vanirakshak-backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vanirakshak-backend/requirements.txt

      - name: Run contract and integration check
        run: python scripts/integration_check.py

  doc-drift-guard:
    name: Documentation Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run documentation drift check
        run: python scripts/check_docs.py

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js build
        run: npm run build
